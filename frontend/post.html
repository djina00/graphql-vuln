<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post - GQL Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">GQL Blog</a>
        <div class="d-flex align-items-center text-light">
            <span class="me-3">Hello, <span id="welcome-name" class="fw-semibold"></span></span>
            <button id="logout-btn" class="btn btn-sm btn-outline-light">Log out</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <a href="index.html" class="text-muted small">&larr; Back to feed</a>

            <div id="post" class="mt-3"></div>

            <h5 class="mt-5 mb-3">Comments</h5>
            <div id="comments"></div>

            <form id="comment-form" class="mt-4">
                <div class="mb-2">
                    <textarea id="comment-body" class="form-control" rows="2"
                              placeholder="Write a comment..." required></textarea>
                </div>
                <div id="comment-error" class="text-danger small mb-2"></div>
                <button type="submit" class="btn btn-primary btn-sm">Post comment</button>
            </form>

        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/post.js"></script>
</body>
</html>
