<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GQL Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">GQL Blog</a>
        <ul class="navbar-nav me-auto ms-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Feed</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link" href="messages.html">Messages</a></li>
        </ul>
        <div class="d-flex align-items-center text-light">
            <span class="me-3">Hello, <span id="welcome-name" class="fw-semibold"></span></span>
            <button id="logout-btn" class="btn btn-sm btn-outline-light">Log out</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <form id="search-form" class="d-flex mb-4">
                <input id="search-input" type="text" class="form-control me-2"
                       placeholder="Search posts...">
                <button class="btn btn-outline-primary" type="submit">Search</button>
                <button id="clear-search" type="button" class="btn btn-link">Clear</button>
            </form>

            <div id="feed"></div>

        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/home.js"></script>
</body>
</html>
