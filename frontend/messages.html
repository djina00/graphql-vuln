<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Messages - GQL Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">GQL Blog</a>
        <ul class="navbar-nav me-auto ms-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Feed</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link active" href="messages.html">Messages</a></li>
        </ul>
        <div class="d-flex align-items-center text-light">
            <span class="me-3">Hello, <span id="welcome-name" class="fw-semibold"></span></span>
            <button id="logout-btn" class="btn btn-sm btn-outline-light">Log out</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h6 class="mb-3">Send a message</h6>
                    <form id="send-form">
                        <div class="row g-2">
                            <div class="col-md-3">
                                <input id="recipient-id" type="number" min="1"
                                       class="form-control" placeholder="To (user id)" required>
                            </div>
                            <div class="col-md-9">
                                <input id="message-body" type="text" class="form-control"
                                       placeholder="Your message" required>
                            </div>
                        </div>
                        <div id="send-error" class="text-danger small mt-2"></div>
                        <button type="submit" class="btn btn-primary btn-sm mt-3">Send</button>
                    </form>
                </div>
            </div>

            <h5 class="mb-3">Inbox</h5>
            <div id="messages"></div>

        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
