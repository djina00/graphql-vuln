services:
  mysql:
    image: mysql:8.0
    container_name: gqlvuln-mysql
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gqlblog
    volumes:
      - gqlvuln_data:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro

volumes:
  gqlvuln_data:
